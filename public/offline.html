<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eb4539" />
    <title>logmaster — offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Manrope",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f3f6fa;
        color: #0a0a0a;
        padding: 1.5rem;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #525252;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: #eb4539;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logmaster_logo_transparent.png" alt="" width="64" height="64" />
      <h1>You&apos;re offline</h1>
      <p>
        Open logmaster while online first so the app shell can install. Your
        trips stay on this device in local storage.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
