name: Android test build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Display version'
        required: true
        default: '1.0'
        type: string
      version_code:
        description: 'Play version code. auto increments DynamoDB. Any other integer is used for this bundle and stored as the last used code.'
        required: true
        default: auto
        type: string
      upload_to_play:
        description: 'Upload the signed bundle to Google Play internal testing'
        required: true
        default: true
        type: boolean
      play_release_status:
        description: 'draft saves in Play Console; completed releases to internal testers'
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Google Play credentials
        if: inputs.upload_to_play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in the android-release environment.'
            echo 'See docs/android-releases-with-github.md, or disable Upload to Play for a build-only run.'
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_BUILD_NUMBERS }}
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - name: Allocate next version code
        id: version_increment
        if: inputs.version_code == 'auto'
        uses: ohthepain/global-build-numbers@main
        with:
          OPERATION: increment
          DYNAMO_TABLE_NAME: global-build-numbers
          DYNAMO_PARTITION_KEY: project-name
          PRODUCT_ID: logmaster-android
      - name: Check version code override
        id: version_override
        if: inputs.version_code != 'auto'
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo 'Play version code must be an integer from 1 through 2100000000, or auto.'
            exit 1
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Store version code override
        id: version_set
        if: inputs.version_code != 'auto'
        uses: ohthepain/global-build-numbers@main
        with:
          OPERATION: set
          VALUE: ${{ steps.version_override.outputs.code }}
          DYNAMO_TABLE_NAME: global-build-numbers
          DYNAMO_PARTITION_KEY: project-name
          PRODUCT_ID: logmaster-android
      - name: Resolve version code
        id: version
        env:
          AUTO: ${{ steps.version_increment.outputs.result }}
          OVERRIDE: ${{ steps.version_set.outputs.result }}
        run: |
          set -euo pipefail
          if [[ -n "${OVERRIDE:-}" ]]; then
            CODE="$OVERRIDE"
          else
            CODE="${AUTO:-}"
          fi
          if [[ -z "$CODE" ]]; then
            echo 'Could not resolve a Play version code.'
            exit 1
          fi
          echo "result=$CODE" >> "$GITHUB_OUTPUT"
          echo "Using Play version code $CODE"
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
        run: pnpm install --frozen-lockfile
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
      - name: Restore upload keystore
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [[ -z "$UPLOAD_KEY_BASE64" ]]; then
            echo 'Missing secret ANDROID_UPLOAD_KEYSTORE_BASE64 on the android-release environment.'
            echo 'See docs/android-releases-with-github.md (one-time setup).'
            exit 1
          fi
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/logmaster-upload.p12"
      - name: Build and sign bundle
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.result }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/logmaster-upload.p12
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'logmaster-upload' }}
        run: bash scripts/android-release.sh
      - name: Save signed bundle and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.result }}-${{ github.sha }}
          path: android/build/release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Google Play internal testing
        if: inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: live.logmaster.app
          releaseFiles: android/build/release-artifacts/*.aab
          track: internal
          status: ${{ inputs.play_release_status }}
          releaseName: ${{ inputs.version_name }} (build ${{ steps.version.outputs.result }})
      - name: Summarize release destination
        env:
          UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
          RELEASE_STATUS: ${{ inputs.play_release_status }}
          VERSION_CODE: ${{ steps.version.outputs.result }}
        run: |
          if [[ "$UPLOAD_TO_PLAY" == 'true' ]]; then
            echo "Google Play internal testing: build $VERSION_CODE uploaded with status $RELEASE_STATUS." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$RELEASE_STATUS" == 'draft' ]]; then
              echo 'Open Logbook2.0 → Test and release → Testing → Internal testing → Edit release to review and roll out.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Check tester availability in Play Console before running Notify Sailors Android testers.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Build $VERSION_CODE saved to GitHub artifacts only; not uploaded to Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/logmaster-upload.p12"
