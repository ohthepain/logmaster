name: Android test build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique integer greater than the last accepted Play version code'
        required: true
        type: string
      version_name:
        description: 'Display version'
        required: true
        default: '1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://localhost:5432/dummy
        run: pnpm install --frozen-lockfile
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
      - name: Restore upload keystore
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$UPLOAD_KEY_BASE64"
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/logmaster-upload.p12"
      - name: Build and sign bundle
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/logmaster-upload.p12
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'logmaster-upload' }}
        run: bash scripts/android-release.sh
      - name: Save signed bundle and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version_code }}-${{ github.sha }}
          path: android/build/release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/logmaster-upload.p12"
